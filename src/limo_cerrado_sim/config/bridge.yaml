# ros_gz_bridge: topicos do LIMO Pro simulado. Nomes ROS iguais aos do robo real
# (limo_base: /cmd_vel /odom /imu; ydlidar: /scan; livox_ros_driver2: /livox/lidar /livox/imu).
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

- ros_topic_name: "/cmd_vel"
  gz_topic_name: "/model/limo/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

- ros_topic_name: "/odom"
  gz_topic_name: "/model/limo/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# odom -> base_footprint (odometria de rodas do plugin DiffDrive)
- ros_topic_name: "/tf"
  gz_topic_name: "/model/limo/tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

- ros_topic_name: "/joint_states"
  gz_topic_name: "/model/limo/joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

# pose verdadeira do robo no mundo (para medir deriva da odometria / do SLAM)
- ros_topic_name: "/ground_truth/odom"
  gz_topic_name: "/model/limo/ground_truth/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# A nuvem do Livox tem ponte propria: config/bridge_livox_<modelo>.yaml (escolhida por livox_model)
- ros_topic_name: "/livox/imu"
  gz_topic_name: "/livox/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

# sensores de fabrica do LIMO Pro (ligados/desligados por argumentos do launch)
- ros_topic_name: "/scan"
  gz_topic_name: "/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

- ros_topic_name: "/imu"
  gz_topic_name: "/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

# A camera RGB-D tem ponte propria: config/bridge_camera_<modelo>.yaml (so sobe com use_camera:=true)
